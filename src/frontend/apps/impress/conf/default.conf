server {
  listen 8080;
  listen 3000;
  server_name localhost;

  root /app;

  location / {
      try_files $uri index.html $uri/index.html =404;

      add_header X-Frame-Options DENY always;
      # HTML is no-cache: pages reference hashed chunks; without Cache-Control
      # browsers heuristic-cache HTML and re-serve deleted chunk paths after a
      # rebuild (the "401-page 404 after sign-in" users hit).
      add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Hashed build assets (next export): immutable.
  location ~* ^(?!/media/)(?!/api/)(?!/admin/)(?!/external_api/)(?!/static/)(?!/collaboration/)\.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ "^/docs/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /docs/[id]/index.html;

      add_header X-Frame-Options DENY always;
      add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~ "^/user-reconciliations/(active|inactive)/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
      try_files $uri /user-reconciliations/$1/[id]/index.html;

      add_header X-Frame-Options DENY always;
      add_header Cache-Control "no-cache, must-revalidate" always;
  }

  error_page 404 /404.html;
  location = /404.html {
      internal;
  }
}
